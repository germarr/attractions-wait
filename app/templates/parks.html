<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Parks · QUEUESCOPE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="/static/app.css?v={{ asset_v }}" rel="stylesheet" />
  <style>
    .seg{display:inline-flex;gap:4px;background:var(--panel);border:1px solid var(--line-2);border-radius:10px;padding:4px}
    .seg button{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);background:none;border:0;padding:7px 12px;border-radius:7px;cursor:pointer}
    .seg button:hover{color:var(--text)}
    .seg button.active{color:var(--accent);background:rgba(255,180,84,.08)}
    .seg.muted button.active{color:var(--accent-2);background:rgba(86,212,196,.08)}

    .live-dot{width:8px;height:8px;border-radius:50%;background:var(--good);display:inline-block;margin-right:8px;animation:pulse 2.4s infinite;vertical-align:middle}

    .livestrip{display:grid;grid-template-columns:repeat(auto-fit,minmax(196px,1fr));gap:12px}
    .ptile{display:flex;flex-direction:column;gap:9px;padding:13px 15px;border:1px solid var(--line);border-radius:10px;background:var(--panel-2)}
    .ptile .pt-head{display:flex;align-items:center;gap:9px;min-width:0}
    .ptile .dot{width:9px;height:9px;border-radius:50%;flex:none}
    .ptile .pt-name{font-size:13px;font-weight:700;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .pt-stats{display:flex;flex-wrap:wrap;gap:6px 13px;font-family:var(--mono);font-size:11px;color:var(--muted)}
    .pt-stats b{color:var(--text);font-weight:600}
    .pt-down{color:var(--bad)}
    .pt-mom.up{color:var(--accent)} .pt-mom.down{color:var(--accent-2)} .pt-mom.flat{color:var(--faint)}

    .radars{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}
    @media(max-width:820px){.radars{grid-template-columns:1fr}}
    .canvas-wrap.radar{height:360px}

    .parks-legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:16px;font-family:var(--mono);font-size:11px;color:var(--muted)}
    .parks-legend span{display:inline-flex;align-items:center;gap:7px}
    .parks-legend i{width:11px;height:11px;border-radius:3px;display:inline-block;flex:none}
  </style>
</head>
<body>
  <div class="wrap">
    <header class="deck">
      <div class="brand">
        <div class="mark"><span class="glyph">◢</span><span>QUEUE</span><span class="queue">SCOPE</span></div>
        <nav class="nav">
          <a href="/">Overview</a>
          <a href="/day">Daily Performance</a>
          <a href="/parks" class="active">Parks</a>
        </nav>
      </div>
      <div class="ctrl">
        <div class="status" id="status"><span class="dot"></span><span id="status-text">connecting</span><b id="updated">—</b></div>
        <div class="seg" id="dest-toggle" aria-label="Select destination"></div>
        <div class="seg muted" id="window-toggle" aria-label="Select window">
          <button data-w="today" class="active">Today</button>
          <button data-w="week">Week</button>
          <button data-w="month">Month</button>
        </div>
      </div>
    </header>

    <section class="panel" id="live-panel">
      <div class="phead">
        <div class="ptitle"><h2><span class="live-dot"></span>Live</h2><span class="pmeta">now · per park</span></div>
        <span class="pmeta" id="dest-label"></span>
      </div>
      <div class="livestrip" id="livestrip"></div>
    </section>

    <section class="radars">
      <div class="panel" id="panel-busy">
        <div class="phead">
          <div class="ptitle"><h2>Busyness</h2><span class="pmeta" id="busy-meta">window · normalized</span></div>
        </div>
        <div class="canvas-wrap radar"><canvas id="chart-busy"></canvas><div class="empty">No data in window</div></div>
      </div>
      <div class="panel" id="panel-ops">
        <div class="phead">
          <div class="ptitle"><h2>Operations</h2><span class="pmeta">window · reliability</span></div>
        </div>
        <div class="canvas-wrap radar"><canvas id="chart-ops"></canvas><div class="empty">No data in window</div></div>
      </div>
    </section>

    <div class="parks-legend" id="legend"></div>
    <div class="corr-note" id="note"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="/static/parks.js?v={{ asset_v }}"></script>
</body>
</html>
